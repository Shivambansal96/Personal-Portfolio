<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Favicon -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.shivambansal.co.in/" />

  <!-- SEO Core -->
  <title>Shivam Bansal | Freelance Web Developer & Technical Trainer</title>

  <meta name="description"
    content="Shivam Bansal is a freelance Web Developer and Technical Trainer specializing in React, JavaScript, and modern web technologies. Explore portfolio, projects, blogs, and training services." />

  <meta name="keywords"
    content="Shivam Bansal, Web Developer, Freelance Web Developer India, React Developer, JavaScript Developer, Frontend Developer, Technical Trainer, Coding Instructor, Web Development Trainer, Freelancer Developer Portfolio" />

  <meta name="author" content="Shivam Bansal" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <!-- Google Verification -->
  <meta name="google-site-verification" content="Hiyogy1nW0hG316QZfX8g5PhbfB-n7xjYry-gdixYGk" />

  <!-- Open Graph (Facebook / LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Shivam Bansal | Freelance Web Developer & Technical Trainer" />
  <meta property="og:description"
    content="Portfolio of Shivam Bansal showcasing web development projects, freelance work, technical training, and blogs." />
  <meta property="og:url" content="https://www.shivambansal.co.in/" />
  <meta property="og:image" content="https://www.shivambansal.co.in/preview.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Shivam Bansal | Web Developer & Trainer" />
  <meta name="twitter:description"
    content="Freelance Web Developer & Technical Trainer. Explore projects, blogs, and services." />
  <meta name="twitter:image" content="https://www.shivambansal.co.in/preview.png" />

  <!-- Structured Data (VERY IMPORTANT FOR SEO) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Shivam Bansal",
    "url": "https://www.shivambansal.co.in",
    "image": "https://www.shivambansal.co.in/profile.jpg",
    "jobTitle": ["Freelance Web Developer", "Technical Trainer"],
    "worksFor": {
      "@type": "Organization",
      "name": "Freelance"
    },
    "sameAs": [
      "https://github.com/Shivambansal96",
      "https://linkedin.com/in/shivambansal96"
    ],
    "knowsAbout": [
      "Web Development",
      "React JS",
      "JavaScript",
      "Frontend Development",
      "Technical Training",
      "Programming Teaching"
    ],
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "India"
    }
  }
  </script>

  <!-- Additional Structured Data for Services -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Shivam Bansal Web Development & Training Services",
    "url": "https://www.shivambansal.co.in",
    "description": "Freelance web development and technical training services in React, JavaScript, and modern web technologies.",
    "areaServed": "Worldwide",
    "serviceType": [
      "Web Development",
      "Frontend Development",
      "Technical Training",
      "Programming Courses"
    ]
  }
  </script>

</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
